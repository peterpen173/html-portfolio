name: Probe price sources

# Research only: reports which shops expose a public, read-only product API.
# Never commits anything; the findings are read from the run log.
on:
  workflow_dispatch:
  push:
    paths:
      - "lego/scripts/probe_sources.py"
      - "lego/scripts/probe_shopify.py"
      - "lego/scripts/probe_match.py"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python lego/scripts/probe_match.py
