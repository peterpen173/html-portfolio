name: LEGO catalog sync

on:
  schedule:
    # 05:10 UTC daily — Rebrickable regenerates its dumps overnight.
    - cron: "10 5 * * *"
  workflow_dispatch:
  # Also run when the site or the sync code changes, so a rebuild can be
  # kicked off from a feature branch without waiting for the nightly schedule.
  push:
    paths:
      - "lego/**"
      - ".github/workflows/lego-catalog.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lego-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog
        id: build
        run: python lego/scripts/build_catalog.py

      - name: Notify about new sets
        if: steps.build.outputs.new_count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python lego/scripts/notify_telegram.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lego/data
          if git diff --staged --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore(lego): sync catalog ($(date -u +%Y-%m-%d))"
            git push
          fi

  # Publishing happens here rather than in its own workflow because a push
  # made by GITHUB_TOKEN does not trigger one, so the site would otherwise
  # keep serving yesterday's catalog.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up the catalog the sync job just committed.
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
